<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShowShelf</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      ;(function restoreGitHubPagesRoute(location) {
        if (location.search.startsWith('?/')) {
          const route = location.search
            .slice(1)
            .split('&')
            .map((part) => part.replace(/~and~/g, '&'))
            .join('?')
          window.history.replaceState(null, '', `${location.pathname.slice(0, -1)}${route}${location.hash}`)
        }
      })(window.location)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
